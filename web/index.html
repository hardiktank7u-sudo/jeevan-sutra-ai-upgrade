<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Jeevan Sutra — Ayurvedic wellness, medicinal plants & traditional Indian knowledge.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Jeevan Sutra">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Jeevan Sutra</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Firebase App Check — Web debug token (localhost only).

    On the FIRST run, the Firebase JS SDK will auto-generate a debug token and
    print it to the browser DevTools console as:

        App Check debug token: <YOUR-TOKEN-HERE>

    Steps to register it:
      1. Open Chrome DevTools → Console after running `flutter run -d chrome`.
      2. Copy the token printed above.
      3. Go to Firebase Console → App Check → Apps → <your web app>
         → Manage debug tokens → Add token → paste and save.

    After registration, App Check calls will succeed locally.

    IMPORTANT: This block is guarded to localhost/127.0.0.1 only.
    It is safe to leave in source control — the debug token is useless outside
    your registered Firebase project. Never hardcode a production token here.
  -->
  <script>
    if (window.location.hostname === 'localhost' ||
        window.location.hostname === '127.0.0.1') {
      self.FIREBASE_APPCHECK_DEBUG_TOKEN = true;
    }
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
